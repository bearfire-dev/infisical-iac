# yaml-language-server: $schema=../../schemas/project.schema.json
schema_version: 1

project:
  name: Vex Machina
  slug: vex-machina
  description: Secrets and delivery configuration for Vex Machina

environments:
  dev:
    name: Development
    position: 1
  prod:
    name: Production
    position: 2

secret_sets:
  runtime:
    path: /runtime
    description: Runtime application secrets
    secrets:
      DATABASE_URL:
        required_in: [dev, prod]
        comment: Primary application database connection
      ANTHROPIC_API_KEY:
        required_in: [dev, prod]
        comment: Anthropic API key used by the agent runtime
        reminder_days: 90

  ci:
    path: /ci
    description: CI-only deployment credentials
    secrets:
      RAILWAY_TOKEN:
        required_in: [prod]
        comment: Railway deployment token used by GitHub Actions
        reminder_days: 90

# Syncs are parked until destination identifiers are confirmed (Railway
# project/environment/service IDs, Worker script name, PAT repo access).
# Un-comment in a follow-up PR; each sync makes Infisical the owner of that
# destination (docs/ADDING_A_PROJECT.md → "Enabling syncs").
syncs: {}

