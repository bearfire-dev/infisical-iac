# yaml-language-server: $schema=../../schemas/project.schema.json
schema_version: 1

project:
  name: Slate Rehm Portfolio
  slug: slaterehm-portfolio
  description: CI deployment credentials for paperkeel/slaterehm-portfolio (Cloudflare Workers through Alchemy)

environments:
  preview:
    name: Preview
    position: 1
  prod:
    name: Production
    position: 2

secret_sets:
  ci:
    path: /ci
    description: GitHub Actions credentials consumed by the Alchemy plan and deploy workflows
    secrets:
      ALCHEMY_STATE_STORE_CREDENTIALS:
        required_in: [preview]
        comment: Cloudflare state-store endpoint and bearer credential used by pull request plans
        reminder_days: 90
      CLOUDFLARE_API_TOKEN:
        required_in: [preview, prod]
        comment: Environment-scoped Cloudflare account token used by Alchemy plans and production deploys
        reminder_days: 90
      CLOUDFLARE_ACCOUNT_ID:
        required_in: [preview, prod]
        comment: Cloudflare account ID delivered with the environment-scoped token

syncs:
  preview-ci-to-github-preview:
    type: github
    connection: github
    source: { environment: preview, secret_set: ci }
    destination:
      scope: repository-environment
      owner: paperkeel
      repository: slaterehm-portfolio
      repository_environment: preview
    auto_sync: true
    manage_deletions: true

  prod-ci-to-github-production:
    type: github
    connection: github
    source: { environment: prod, secret_set: ci }
    destination:
      scope: repository-environment
      owner: paperkeel
      repository: slaterehm-portfolio
      repository_environment: production
    auto_sync: true
    manage_deletions: true
