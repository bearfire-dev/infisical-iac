# yaml-language-server: $schema=../../schemas/project.schema.json
schema_version: 1

project:
  name: Bearly Browser Sync
  slug: bearly-browser-sync
  description: CI deployment credentials for paperkeel/bearly-browser-sync (Cloudflare Workers via Alchemy)

# The Worker itself has no runtime secrets (only bindings). Secrets exist only
# for GitHub Actions deploys, which run per GitHub environment.
environments:
  preview:
    name: Preview
    position: 1
  prod:
    name: Production
    position: 2

secret_sets:
  ci:
    path: /ci
    description: GitHub Actions deployment credentials consumed by deploy*.yml and preview.yml
    secrets:
      CLOUDFLARE_API_TOKEN:
        required_in: [preview, prod]
        comment: Cloudflare account token (Workers Scripts/Routes, Secrets Store, Zone Read) used by Alchemy deploys
        reminder_days: 90
      CLOUDFLARE_ACCOUNT_ID:
        required_in: [preview, prod]
        comment: Cloudflare account ID (non-secret, but delivered alongside the token so the workflow contract is unchanged)

# Infisical owns these GitHub secrets from here on. The app repository's
# deploy*.yml / preview.yml read CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# from the `production` / `preview` GitHub environments and the repository level.
syncs:
  prod-ci-to-github-repository:
    type: github
    connection: github
    source: { environment: prod, secret_set: ci }
    destination:
      scope: repository
      owner: paperkeel
      repository: bearly-browser-sync
    auto_sync: true
    manage_deletions: true

  prod-ci-to-github-production:
    type: github
    connection: github
    source: { environment: prod, secret_set: ci }
    destination:
      scope: repository-environment
      owner: paperkeel
      repository: bearly-browser-sync
      repository_environment: production
    auto_sync: true
    manage_deletions: true

  preview-ci-to-github-preview:
    type: github
    connection: github
    source: { environment: preview, secret_set: ci }
    destination:
      scope: repository-environment
      owner: paperkeel
      repository: bearly-browser-sync
      repository_environment: preview
    auto_sync: true
    manage_deletions: true
