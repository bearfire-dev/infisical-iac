# yaml-language-server: $schema=../../schemas/project.schema.json
schema_version: 1

project:
  name: Bearly Browser Sync
  slug: bearly-browser-sync
  description: CI deployment credentials for bearfire-dev/bearly-browser-sync (Cloudflare Workers via Alchemy)

# The Worker itself has no runtime secrets (only bindings). Secrets exist only
# for GitHub Actions deploys, which run per GitHub environment.
environments:
  preview:
    name: Preview
    position: 1
  prod:
    name: Production
    position: 2

secret_sets:
  ci:
    path: /ci
    description: GitHub Actions deployment credentials consumed by deploy*.yml and preview.yml
    secrets:
      CLOUDFLARE_API_TOKEN:
        required_in: [preview, prod]
        comment: Cloudflare account token (Workers Scripts/Routes, Secrets Store, Zone Read) used by Alchemy deploys
        reminder_days: 90
      CLOUDFLARE_ACCOUNT_ID:
        required_in: [preview, prod]
        comment: Cloudflare account ID (non-secret, but delivered alongside the token so the workflow contract is unchanged)

# Syncs are enabled in a follow-up PR once the values above are populated in
# Infisical (docs/MIGRATION.md: never let a placeholder overwrite a working
# destination). The app repository's workflows read these from the `preview`
# and `production` GitHub environments, and the repository-level copies.
syncs: {}

